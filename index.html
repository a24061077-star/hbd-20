<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生日快樂🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2226; --mute:#9b8a90; --rose:#e9839f; --rose-d:#cf5f80; --rose-l:#f8d9e2;
  --paper:#fbf6f3; --glass:rgba(255,255,255,.62);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --serif:"Noto Serif TC",serif; --round:"Huninn","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#120c0e;color:var(--ink);font-family:var(--round);overflow:hidden}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.off{opacity:0;pointer-events:none;transform:scale(1.03);filter:blur(6px)}
/* grain */
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- lock ---------- */
#lock{align-items:center;color:#fff;background:#3a2930}
#lock .wall{position:absolute;inset:-30px;background:url(wall.jpg) center/cover;filter:saturate(1.1) brightness(.72);transform:scale(1.1)}
#lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,20,28,.15),rgba(40,20,28,.55))}
#lock>.date,#lock>.time,#lock>.notif{position:relative}
#lock .date{margin-top:calc(78px + var(--st));font-size:17px;font-weight:500;letter-spacing:1px;opacity:.9;font-family:"Noto Sans TC"}
#lock .time{font-family:"Noto Sans TC";font-weight:300;font-size:92px;line-height:1.05;letter-spacing:-2px}
.notif{margin-top:40px;width:88%;background:rgba(255,255,255,.22);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-radius:22px;padding:13px 15px;display:flex;gap:12px;align-items:center;cursor:pointer;border:1px solid rgba(255,255,255,.25);
  animation:drop .9s cubic-bezier(.2,1.3,.4,1) 1.2s both}
@keyframes drop{from{transform:translateY(-36px);opacity:0}}
.notif .av{background:#fff}
.notif .ttl{font-weight:700;font-size:15px;font-family:"Noto Sans TC"}.notif .txt{font-size:15px;opacity:.95;margin-top:1px}
.notif .when{margin-left:auto;font-size:12px;opacity:.75;align-self:flex-start}
.swipe{position:absolute;bottom:calc(34px + var(--sb));font-size:13px;letter-spacing:2px;opacity:.75;animation:breathe 2.4s infinite}
@keyframes breathe{50%{opacity:.25}}
.homebar{position:absolute;bottom:calc(10px + var(--sb));width:130px;height:5px;border-radius:9px;background:rgba(255,255,255,.8)}

/* ---------- pass ---------- */
#pass{align-items:center;justify-content:center;padding:28px;background:radial-gradient(120% 80% at 50% 0%,#fff 0%,#fbeef1 55%,#f6dde5 100%)}
#pass .av{width:70px;height:70px;box-shadow:0 10px 30px rgba(207,95,128,.25)}
#pass h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:22px 0 8px;letter-spacing:1px}
#pass p{margin:0 0 22px;color:var(--mute);font-size:15px;text-align:center;line-height:1.7}
#pass input{width:100%;max-width:290px;font:inherit;font-size:18px;padding:15px 16px;border-radius:18px;border:1px solid #efd3dc;outline:none;text-align:center;background:rgba(255,255,255,.9);box-shadow:inset 0 1px 3px rgba(0,0,0,.04);-webkit-user-select:text;user-select:text}
#pass input:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(233,131,159,.15)}
.btn{font:inherit;border:none;background:linear-gradient(135deg,#ef93ad,#d9688a);color:#fff;font-size:16px;padding:13px 30px;border-radius:999px;margin-top:16px;cursor:pointer;box-shadow:0 8px 22px rgba(207,95,128,.32);letter-spacing:1px}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.75);color:var(--rose-d);box-shadow:none;border:1px solid #f0cfd9}
#passMsg{min-height:24px;margin-top:14px;font-size:14px;color:var(--rose-d)}
#passOpts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- chat ---------- */
#chat{background:linear-gradient(180deg,#fbf3f1 0%,#f8ece9 100%)}
.head{position:relative;padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;gap:11px;background:rgba(251,246,243,.78);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border-bottom:1px solid rgba(0,0,0,.05);z-index:3}
.head .name{font-weight:700;font-size:17px;font-family:"Noto Sans TC"}.head .sub{font-size:12px;color:var(--mute);transition:color .3s}
.head .sub.typing{color:var(--rose-d)}
#mute{margin-left:auto;border:none;background:rgba(0,0,0,.05);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:#fde7ec}
#log{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px 26px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;margin:5px 0;align-items:flex-end;animation:pop .45s cubic-bezier(.2,1.25,.5,1) both}
@keyframes pop{from{transform:translateY(12px) scale(.94);opacity:0}}
.row.me{justify-content:flex-end}
.row .av{width:32px;height:32px}
.row.cont .av{visibility:hidden}
.b{max-width:75%;padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.55;background:#fff;box-shadow:0 1px 1px rgba(80,30,45,.04),0 4px 14px rgba(80,30,45,.05);word-break:break-word}
.row:not(.me) .b{border-bottom-left-radius:7px}
.me .b{background:linear-gradient(135deg,#ef93ad,#dc7093);color:#fff;border-bottom-right-radius:7px}
.b.emo{background:none;box-shadow:none;font-size:30px;padding:0 2px;letter-spacing:-2px}
.read{font-size:11px;color:var(--mute);margin-right:2px}
.recall{text-align:center;margin:10px 0;font-size:12.5px;color:var(--mute);animation:pop .4s both}
.recall span{background:rgba(0,0,0,.045);padding:5px 12px;border-radius:999px}
.typing .b{display:flex;gap:5px;padding:14px 15px}
.typing i{width:7px;height:7px;border-radius:50%;background:#e9c3ce;animation:dot 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-4px);background:var(--rose)}}

/* polaroid media */
.pol{background:#fff;padding:8px 8px 10px;border-radius:6px;box-shadow:0 2px 4px rgba(60,20,30,.06),0 12px 28px rgba(60,20,30,.13);max-width:72%;transform:rotate(var(--r,0deg));transition:transform .3s;margin:4px 0}
.pol img,.pol video{display:block;width:100%;max-height:400px;object-fit:cover;border-radius:2px;background:#eee4e6}
.pol img{cursor:zoom-in;animation:develop 2.2s ease-out both}
@keyframes develop{0%{filter:brightness(1.9) saturate(0) blur(6px) sepia(.4)}60%{filter:brightness(1.1) saturate(.7) blur(0) sepia(.2)}100%{filter:none}}
.pol .cap{font-family:var(--round);font-size:14px;color:#6b5860;padding:8px 4px 0;text-align:center}

.dock{position:relative;padding:12px 14px calc(14px + var(--sb));background:rgba(251,246,243,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.05);min-height:70px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;z-index:3}
.opt{font:inherit;font-size:15px;border:1px solid #efc6d2;background:#fff;color:var(--rose-d);padding:10px 17px;border-radius:999px;cursor:pointer;animation:pop .35s both;box-shadow:0 3px 10px rgba(207,95,128,.1)}
.opt:active{transform:scale(.96);background:#fff3f6}
.next{font:inherit;font-size:15px;border:1px solid #f0cfd9;background:#fff;color:var(--rose-d);cursor:pointer;padding:10px 26px;border-radius:999px;box-shadow:0 2px 10px rgba(80,30,45,.07);animation:pop .3s both,glow 2.2s 1s infinite}
@keyframes glow{50%{box-shadow:0 2px 18px rgba(233,131,159,.35)}}
.longmsg{max-width:84%;white-space:pre-wrap;font-size:15.5px;line-height:1.75}

/* ---------- stats overlay ---------- */
#stats{background:radial-gradient(120% 90% at 50% 10%,#3b2630 0%,#1d1317 70%);color:#fff;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20}
#stats .k{font-size:14px;letter-spacing:3px;opacity:.6;margin-bottom:6px}
#stats .num{font-family:"Noto Sans TC";font-weight:300;font-size:50px;line-height:1.1;font-variant-numeric:tabular-nums}
#stats .u{font-size:16px;opacity:.75;margin-top:2px}
.sline{position:relative;z-index:2;margin:10px 0;opacity:0;transform:translateY(14px);transition:all .8s cubic-bezier(.2,.8,.2,1)}
.sline.on{opacity:1;transform:none}
#stats .small{font-size:15px;opacity:.75;line-height:1.7;margin-top:6px}
.rain{position:absolute;z-index:1;opacity:.4;top:-60px;font-size:30px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(var(--rot))}}
#stats .btn{position:relative;z-index:2}

@media (max-height:700px){#stats .num{font-size:40px}#stats .k{font-size:12px}.sline{margin:6px 0}#stats .u{font-size:14px}}
/* progress + toast */
#prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#f5b5c7,#d9688a);transition:width .6s ease}
#toast{position:absolute;top:calc(64px + var(--st));left:50%;transform:translate(-50%,-10px);background:rgba(45,34,38,.85);color:#fff;font-size:13px;padding:7px 14px;border-radius:999px;opacity:0;transition:all .3s;z-index:5;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
#casc{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:opacity .9s;z-index:3}
#cDate{margin-top:calc(54px + var(--st));font-family:"Noto Sans TC";font-weight:300;font-size:40px;letter-spacing:2px;font-variant-numeric:tabular-nums;opacity:.95}
#cList{position:relative;flex:1;width:100%;max-width:400px;overflow:hidden;padding:0 18px;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 35%);mask-image:linear-gradient(180deg,transparent 0%,#000 35%);display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:40px}
.cb{display:flex;margin:4px 0;animation:cpop .25s ease-out both}
.cb.r{justify-content:flex-end}
.cb span{background:rgba(255,255,255,.14);color:#fff;font-size:15px;padding:7px 13px;border-radius:16px;max-width:70%}
.cb.r span{background:linear-gradient(135deg,#ef93ad,#d9688a)}
.cb small{font-size:10px;opacity:.4;align-self:flex-end;margin:0 6px}
@keyframes cpop{from{opacity:0;transform:translateY(10px)}}
#cDay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s;z-index:3}
#cDay .num{font-size:96px !important}
#cDay.on{opacity:1}
/* quiz bars */
.card{background:#fff;border-radius:22px;padding:16px 16px 12px;max-width:84%;min-width:240px;box-shadow:0 4px 18px rgba(80,30,45,.08)}
.bars .bar{margin:10px 0}
.bars .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bars .track{height:10px;background:#f7ecef;border-radius:9px;overflow:hidden}
.bars .fill{height:100%;width:0;background:linear-gradient(90deg,#f5b5c7,#d9688a);border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bars .win .lab{font-weight:700;color:var(--rose-d)}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(18,10,13,.94);display:none;align-items:center;justify-content:center;z-index:60;padding:22px}
#lb img{max-width:100%;max-height:100%;border-radius:8px;animation:zoomin .35s cubic-bezier(.2,1,.3,1)}
@keyframes zoomin{from{transform:scale(.85);opacity:0}}

/* ---------- finale ---------- */
#fin{background:#140c10;color:#fff;align-items:center;justify-content:center;text-align:center;overflow:hidden;z-index:10}
#fin .glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,90,.38),rgba(255,140,120,.1) 40%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-62%);transition:opacity 1.2s;animation:warm 3s ease-in-out infinite}
@keyframes warm{50%{opacity:.75}}
#fin.lit{background:radial-gradient(130% 90% at 50% 20%,#fff6f2 0%,#fbe3e9 55%,#f3c9d5 100%);color:var(--ink);transition:background 1.4s}
#fin.lit .glow{opacity:0}
#finHint{position:relative;font-size:15px;opacity:.85;letter-spacing:1px;margin-top:18px;min-height:24px}
#finTop{position:relative;font-family:var(--serif);font-size:21px;letter-spacing:3px;opacity:.9;margin-bottom:10px}
#cake{position:relative;cursor:pointer;touch-action:none}
.flame{transform-origin:50% 100%;animation:flick .18s infinite alternate}
@keyframes flick{to{transform:scaleY(1.14) scaleX(.88) skewX(3deg)}}
.out .flame{animation:none;opacity:0;transition:opacity .25s}
.smoke{opacity:0}.out .smoke{animation:smoke 2s forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(2.2)}}
#ring{transition:stroke-dashoffset .1s linear}
#final{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(40px + var(--st)) 22px calc(30px + var(--sb));overflow-y:auto}
#final.show{display:flex}
.fin-k{font-size:13px;letter-spacing:6px;color:var(--rose-d);opacity:0;animation:rise 1s .2s forwards}
.fin-name{font-family:var(--serif);font-weight:900;font-size:40px;letter-spacing:6px;color:#4a2532;margin:6px 0 0;opacity:0;animation:rise 1.2s .5s forwards}
.fin-sub{font-family:var(--serif);font-size:19px;letter-spacing:4px;color:#8a4a60;opacity:0;animation:rise 1.2s .9s forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.polas{position:relative;width:300px;height:300px;margin:24px auto 8px}
.pola{position:absolute;width:150px;background:#fff;padding:8px 8px 30px;border-radius:3px;box-shadow:0 10px 30px rgba(90,30,50,.22);opacity:0;animation:drop2 .9s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes drop2{from{opacity:0;transform:translateY(-40px) rotate(0deg) scale(1.1)}to{opacity:1}}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.note{font-size:16px;color:#6b4552;line-height:1.9;margin-top:8px;opacity:0;animation:rise 1s 3.2s forwards}
#replay{opacity:0;animation:rise 1s 4s forwards}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
</style>
</head>
<body>
<div id="app">

  <!-- 鎖定畫面 -->
  <section id="lock" class="screen">
    <div class="wall"></div><div class="shade"></div>
    <div class="date" id="lkDate"></div>
    <div class="time" id="lkTime"></div>
    <div class="notif" id="notif">
      <div class="av" id="avLock"></div>
      <div><div class="ttl">貓</div><div class="txt">欸 你醒著嗎（X</div></div>
      <div class="when">現在</div>
    </div>
    <div class="swipe">點一下通知</div>
    <div class="homebar"></div>
  </section>

  <!-- 密碼 -->
  <section id="pass" class="screen off grain">
    <div class="av" id="avPass"></div>
    <h2>先證明你是本人（X</h2>
    <p>我們第一次傳訊息是在聊什麼？<br><span style="font-size:13px">（誒其實我也不確定（X</span></p>
    <input id="pw" autocomplete="off" placeholder="輸入答案">
    <button class="btn" id="pwBtn">解鎖</button>
    <div id="passMsg"></div>
    <div id="passOpts"></div>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="screen off">
    <div class="head"><div class="av" id="avHead"></div><div><div class="name">貓</div><div class="sub" id="sub">在線上</div></div><button id="mute" aria-label="音樂">🔊</button><div id="prog"></div></div><div id="toast"></div>
    <div id="log"></div>
    <div class="dock" id="dock"></div>
  </section>

  <!-- 統計 -->
  <section id="stats" class="screen off">
    <div id="casc"><div id="cDate">23.11.26</div><div id="cList"></div></div>
    <div id="cDay"><div class="k">從我手機裡第一則訊息算起 今天是第</div><div class="num" id="nDay">0</div><div class="u">天</div></div>
    <div class="sline" id="s2"><div class="k">沒講話的天數</div><div class="num" id="n2">0</div><div class="u">天（那3天是去哪了</div></div>
    <div class="sline" id="s3"><div class="k">我們傳的訊息</div><div class="num" id="n3">0</div><div class="u">則</div></div>
    <div class="sline" id="s4"><div class="k">裡面總共有</div><div class="num" id="n4">0</div><div class="u">個 🤣</div><div class="small" id="s4b" style="opacity:0;transition:opacity 1s">其中 65,573 個是你傳的🤣🤣🤣</div></div>
    <div class="sline" id="s5"><div class="small" style="margin-bottom:14px;font-size:13px">（只有賴的紀錄，還沒算ig跟mes）</div><button class="btn ghost" id="statsBack">回去聊天</button></div>
  </section>

  <!-- 結尾 -->
  <section id="fin" class="screen off">
    <div class="glow"></div>
    <div id="cakeWrap" style="position:relative">
      <div id="finTop">許個願</div>
      <svg id="cake" width="250" height="270" viewBox="0 0 250 270">
        <defs>
          <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff9f6"/><stop offset="1" stop-color="#f6e6e2"/></linearGradient>
          <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb3c7"/><stop offset="1" stop-color="#ef8ead"/></linearGradient>
          <radialGradient id="halo"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
          <radialGradient id="fl" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff7c2"/><stop offset=".5" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff8a3d"/></radialGradient>
        </defs>
        <circle id="ringBg" cx="125" cy="150" r="118" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>
        <circle id="ring" cx="125" cy="150" r="118" fill="none" stroke="#ffd59a" stroke-width="3" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="741.4" transform="rotate(-90 125 150)"/>
        <ellipse cx="125" cy="246" rx="102" ry="12" fill="#000" opacity=".25"/>
        <rect x="35" y="166" width="180" height="78" rx="14" fill="url(#g1)"/>
        <path d="M35 184 q15 18 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 v-6 a14 14 0 0 0 -14 -12 h-152 a14 14 0 0 0 -14 12z" fill="url(#g2)"/>
        <rect x="57" y="120" width="136" height="54" rx="12" fill="url(#g1)"/>
        <path d="M57 134 q11 13 22.6 0 t22.6 0 t22.6 0 t22.6 0 t22.6 0 t22.6 0 v-3 a12 12 0 0 0 -12 -11 h-112 a12 12 0 0 0 -12 11z" fill="#ffc9d7"/>
        <g fill="#fff" opacity=".9"><circle cx="78" cy="214" r="3"/><circle cx="125" cy="222" r="3"/><circle cx="172" cy="214" r="3"/><circle cx="100" cy="156" r="2.5"/><circle cx="150" cy="156" r="2.5"/></g>
        <g font-family="Noto Sans TC,sans-serif" font-weight="700" font-size="60" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke">
          <text x="104" y="124" fill="#ffbd5c">2</text><text x="147" y="124" fill="#86d2bd">0</text></g>
        <g id="candles">
          <rect x="103" y="68" width="2.5" height="10" fill="#5a3a40"/><rect x="146" y="68" width="2.5" height="10" fill="#5a3a40"/>
          <circle cx="104" cy="58" r="26" fill="url(#halo)" class="flame"/><circle cx="147" cy="58" r="26" fill="url(#halo)" class="flame"/>
          <path class="flame" d="M104 44 q11 15 0 26 q-11 -11 0 -26z" fill="url(#fl)"/>
          <path class="flame" d="M147 44 q11 15 0 26 q-11 -11 0 -26z" fill="url(#fl)" style="animation-delay:.09s"/>

let AC=null, master=null, musicGain=null, sfxGain=null, muted=false, bgTimer=null;
function silentUnlock(){ try{
  const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');a.play().catch(()=>{});
}catch(e){} }
function initAudio(){
  if(AC) return; silentUnlock(); try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  // soft reverb-ish echo
  const d=AC.createDelay();d.delayTime.value=.23;const fb=AC.createGain();fb.gain.value=.28;const wet=AC.createGain();wet.gain.value=.25;
  d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(master);
  musicGain=AC.createGain();musicGain.gain.value=.0;musicGain.connect(master);musicGain.connect(d);
  sfxGain=AC.createGain();sfxGain.gain.value=.5;sfxGain.connect(master);
  }catch(e){AC=null}
}
function tone(f,t,dur,vol,type='sine',dest=musicGain){ if(!AC) return;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);}
function bell(f,t,vol=.12,dur=1.6,dest=musicGain){ tone(f,t,dur,vol,'sine',dest); tone(f*2.01,t,dur*.5,vol*.35,'sine',dest); tone(f*3.98,t,dur*.25,vol*.12,'sine',dest); }
const N=n=>440*Math.pow(2,(n-69)/12);
/* 背景：原創的八音盒小旋律 */
const BG=[[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]];
function bgLoop(){
  if(!AC) return; let t=AC.currentTime+.1; const beat=.42;
  BG.forEach((ch,i)=>{ const s=t+i*beat*8;
    tone(N(ch[0]-12),s,beat*7.5,.05,'triangle');
    [0,1,2,3,2,1,2,3].forEach((k,j)=>bell(N(ch[k]+12),s+j*beat,.045+(j===0?.02:0),1.4));
  });
  bgTimer=setTimeout(bgLoop,beat*32*1000-120);
}
function startBg(){ if(!AC||bgTimer) return; musicGain.gain.cancelScheduledValues(AC.currentTime);musicGain.gain.setTargetAtTime(muted?0:.9,AC.currentTime,1.5); bgLoop(); }
function stopBg(){ if(!AC) return; clearTimeout(bgTimer);bgTimer=null; musicGain.gain.setTargetAtTime(0,AC.currentTime,.6); }
function sfx(kind){ if(!AC||muted) return; const t=AC.currentTime;
  if(kind==='pop'){ tone(880,t,.12,.18,'sine',sfxGain); tone(1320,t+.04,.12,.12,'sine',sfxGain); }
  if(kind==='send'){ tone(660,t,.08,.12,'triangle',sfxGain); tone(990,t+.05,.1,.1,'triangle',sfxGain); }
  if(kind==='photo'){ const b=AC.createBufferSource(),buf=AC.createBuffer(1,AC.sampleRate*.12,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);b.buffer=buf;const g=AC.createGain();g.gain.value=.25;b.connect(g);g.connect(sfxGain);b.start(t);
      tone(1800,t+.02,.05,.06,'square',sfxGain); }
  if(kind==='unlock'){ [72,76,79,84].forEach((n,i)=>bell(N(n),t+i*.09,.12,1.2,sfxGain)); }
  if(kind==='tick'){ tone(1500,t,.03,.05,'square',sfxGain); }
  if(kind==='recall'){ tone(520,t,.15,.12,'sine',sfxGain); tone(390,t+.08,.2,.1,'sine',sfxGain); }
  if(kind==='blow'){ const b=AC.createBufferSource(),buf=AC.createBuffer(1,AC.sampleRate*.9,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/d.length)*.6; b.buffer=buf; const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;b.connect(f);f.connect(sfxGain);b.start(t); }
  try{navigator.vibrate&&navigator.vibrate(kind==='pop'?8:20)}catch(e){}
}

function happyBirthday(){
  if(!AC) return; const q=.36; let t=AC.currentTime+.3;
  const mel=[[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
             [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3]];
  const g=AC.createGain();g.gain.value=muted?0:1;g.connect(master);

  return t-AC.currentTime;
}

    sfx('photo');
    const im=r.querySelector('img'); if(im){im.onclick=e=>{e.stopPropagation();zoom(im.src)};im.onload=scroll;}
    const v=r.querySelector('video'); if(v){ v.onplay=()=>{ if(AC) musicGain.gain.setTargetAtTime(0,AC.currentTime,.3); }; v.onpause=v.onended=()=>{ if(AC&&!muted) musicGain.gain.setTargetAtTime(.9,AC.currentTime,.8); }; }
    await wait(900); await next(); if(v&&!v.paused) v.pause(); return;
  }
  if(s.choice){
    const pick=await choose(s.choice);
    row('me',`<div class="b">${esc(pick.o)}</div>`); sfx('send'); await wait(600);
    for(const t of pick.r) await say(t); return;
  }
  if(s.recall){
    await wait(1400); log.lastElementChild.remove(); lastSide=null;
    const d=document.createElement('div');d.className='recall';d.innerHTML='<span>貓已收回訊息</span>';log.appendChild(d);scroll(); sfx('recall'); await wait(1300); return;
  }
  if(s.long){
    await typing(3400);
    const lr=row('cat',`<div class="b longmsg">${esc(s.long)}</div>`); sfx('pop');
    setTimeout(()=>{log.scrollTop=lr.offsetTop-80},120);
    await wait(1200); return next('看完了');
  }
  if(s.stats) return statsScene();
  if(s.quiz){
    await say('你最常講哪一句？');
    const pick=await choose(['嘿','等一下','怎麼辦','超級無敵']);
    row('me',`<div class="b">${pick}</div>`); sfx('send'); await wait(600);
    await say(pick==='嘿'?'答對了🤣🤣':'答錯了（X');
    await typing(800);
    const max=WORDS[0][1];
    const r=row('cat',`<div class="card bars"><div style="font-size:13px;color:#8b6f79">你傳的訊息裡出現的次數</div>${WORDS.map((w,i)=>`<div class="bar ${i===0?'win':''}"><div class="lab"><span>${w[0]}</span><span>${w[1].toLocaleString()}</span></div><div class="track"><div class="fill" data-w="${w[1]/max*100}"></div></div></div>`).join('')}</div>`);
    sfx('pop'); setTimeout(()=>r.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),120);
    await wait(1800); await say('「嘿」2577次'); await say('🤣🤣🤣🤣'); await say('（太多了吧'); return next();
  }
  if(s.finale){ await wait(900); return finale(); }
}
async function run(){ for(let i=0;i<SCRIPT.length;i++){ $('#prog').style.width=(i/SCRIPT.length*100)+'%'; await step(SCRIPT[i]); } }

/* ---------------- stats scene ---------------- */
function countUp(el,to,ms){return new Promise(r=>{const t0=performance.now();let lastT=0;
  (function f(now){const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();
    if(now-lastT>70&&p<1){sfx('tick');lastT=now;} p<1?requestAnimationFrame(f):r();})(t0);});}
function rain(n){ const app=$('#stats');
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='rain';e.textContent='🤣';
    e.style.left=Math.random()*100+'%';e.style.fontSize=(18+Math.random()*26)+'px';e.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    e.style.animationDuration=(2.2+Math.random()*2.4)+'s';e.style.animationDelay=(Math.random()*2.2)+'s';app.appendChild(e);setTimeout(()=>e.remove(),7500);} }
function statsScene(){return new Promise(async res=>{
  show('#stats'); await wait(900);
  const on=id=>$(id).classList.add('on');
  // 1) 三年的訊息刷過去
  const L=$('#cList'), D=$('#cDate'); const n=CASCADE.length;
  for(let i=0;i<n;i++){ const [d,side,t]=CASCADE[i];
    const e=document.createElement('div'); e.className='cb'+(side?' r':'');
    e.innerHTML=side?`<small>${d}</small><span>${esc(t)}</span>`:`<span>${esc(t)}</span><small>${d}</small>`;
    L.appendChild(e); if(L.children.length>16) L.firstElementChild.remove(); D.textContent=d;
    if(i%2===0) sfx('tick');
    const p=i/n; await new Promise(r=>setTimeout(r, i>n-4?700: i<12?340: Math.max(12, 70*Math.pow(1-p,2))));
  }
  await new Promise(r=>setTimeout(r,1400));
  $('#casc').style.opacity=0; await new Promise(r=>setTimeout(r,900)); $('#casc').style.display='none';
  const today=Math.floor((Date.now()-new Date(2023,10,26).getTime())/86400000)+1;
  $('#cDay').classList.add('on'); await countUp($('#nDay'),Math.max(1096,today),1800); sfx('unlock');
  await new Promise(r=>setTimeout(r,2600)); $('#cDay').classList.remove('on'); await new Promise(r=>setTimeout(r,900));
  // 2) 數字
  on('#s2'); $('#n2').textContent='3'; sfx('pop'); await wait(1400);
  on('#s3'); await countUp($('#n3'),329634,2000); await wait(500);
  on('#s4'); rain(90); await countUp($('#n4'),87883,2400); $('#s4b').style.opacity=.85; await wait(1600);
  on('#s5'); $('#statsBack').onclick=()=>{ show('#chat'); setTimeout(res,600); };
});}

/* ---------------- finale ---------------- */
async function finale(){
  dock.innerHTML=''; stopBg(); await wait(600); show('#fin');
  await wait(1400); $('#finTop').textContent='許個願'; happyBirthday();
  const cake=$('#cake'), ring=$('#ring'); const C=741.4; let p=0, holding=false, done=false, raf;
  const loop=()=>{ if(done) return; p=Math.max(0,Math.min(1,p+(holding?.012:-.02))); ring.style.strokeDashoffset=C*(1-p);
    if(p>=1){ done=true; blow(); return;} raf=requestAnimationFrame(loop); };
  const down=e=>{e.preventDefault();holding=true;if(!raf)loop();}; const up=()=>{holding=false};
  cake.addEventListener('pointerdown',down); window.addEventListener('pointerup',up); cake.addEventListener('pointerleave',up);
  loop();
}
function blow(){
  sfx('blow'); $('#candles').classList.add('out'); $('#ring').style.opacity=0; $('#finHint').textContent='';
  setTimeout(()=>{ $('#fin').classList.add('lit'); fireworks(); sfx('unlock'); },700);
  setTimeout(()=>{ $('#cakeWrap').style.display='none'; const f=$('#final'); f.classList.add('show');
    $('#polas').innerHTML=POLAS.map((p,i)=>`<div class="pola" style="left:${[6,138,16,140][i]}px;top:${[0,18,124,140][i]}px;transform:rotate(${[-7,6,4,-5][i]}deg);animation-delay:${1.4+i*.35}s"><img src="${p}.jpg" alt=""></div>`).join('');
    $('#note').innerHTML=NOTE; },2300);
}
$('#replay').onclick=()=>location.reload();

/* confetti + fireworks */
function fireworks(){
  const c=$('#fx'),x=c.getContext('2d'),dpr=devicePixelRatio||1;const W=c.width=c.offsetWidth*dpr,H=c.height=c.offsetHeight*dpr;
  const cols=['#ff8fb0','#ffd36e','#8fd8c3','#b9b3ff','#ffffff','#ff6f98','#ffb36b'];const P=[];
  const burst=(bx,by,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*7)*dpr;P.push({x:bx,y:by,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:cols[Math.random()*cols.length|0],sz:(2+Math.random()*3)*dpr,k:'s'})}};
  for(let i=0;i<140;i++)P.push({x:W/2,y:H*.45,vx:(Math.random()-.5)*18*dpr,vy:(-Math.random()*18-6)*dpr,l:1.6,c:cols[Math.random()*cols.length|0],sz:(5+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.3,k:'c'});
  [[.25,.25,600],[.75,.2,1100],[.5,.15,1700],[.3,.3,2400],[.7,.32,3000]].forEach(([a,b,d])=>setTimeout(()=>{burst(W*a,H*b,70); if(AC&&!muted) tone(180,AC.currentTime,.25,.12,'sine',sfxGain);},d));
  let t=0;(function f(){x.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vy+=(p.k==='c'?.38:.09)*dpr;p.vx*=.985;p.vy*=p.k==='s'?.985:1;p.x+=p.vx;p.y+=p.vy;p.l-=p.k==='s'?.012:.004;
      if(p.l<=0||p.y>H+40){P.splice(i,1);continue;} x.globalAlpha=Math.min(1,p.l);x.fillStyle=p.c;
      if(p.k==='c'){p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);x.restore();}
      else{x.beginPath();x.arc(p.x,p.y,p.sz,0,7);x.fill();}}
    x.globalAlpha=1; if(++t<600&&(P.length||t<200))requestAnimationFrame(f); else x.clearRect(0,0,W,H);})();
}
